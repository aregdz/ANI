{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>404 — А.Н.И.</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            color: #fff;
            overflow: hidden;
            background: #07090f;
        }

        .bg {
            position: fixed;
            inset: 0;
            background:
                radial-gradient(circle at 20% 20%, rgba(216,196,143,.35), transparent 30%),
                radial-gradient(circle at 80% 30%, rgba(80,120,255,.25), transparent 35%),
                linear-gradient(120deg, #05070d, #171b2a, #05070d);
            animation: moveBg 9s ease-in-out infinite alternate;
        }

        .bg::after {
            content: "";
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px);
            background-size: 42px 42px;
            opacity: .35;
        }

        @keyframes moveBg {
            from { transform: scale(1); filter: hue-rotate(0deg); }
            to { transform: scale(1.08); filter: hue-rotate(25deg); }
        }

        .wrap {
            position: relative;
            z-index: 2;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
        }

        .card {
            max-width: 720px;
            padding: 48px 32px;
            border: 1px solid rgba(255,255,255,.16);
            border-radius: 28px;
            background: rgba(10, 12, 20, .68);
            backdrop-filter: blur(18px);
            box-shadow: 0 30px 100px rgba(0,0,0,.45);
        }

        .code {
            font-size: clamp(82px, 16vw, 160px);
            line-height: .9;
            font-weight: 900;
            color: #d8c48f;
            text-shadow: 0 0 35px rgba(216,196,143,.45);
        }

        h1 {
            margin: 18px 0 12px;
            font-size: clamp(26px, 4vw, 42px);
        }

        p {
            margin: 0 auto;
            max-width: 560px;
            color: #d8d8d8;
            font-size: 18px;
            line-height: 1.7;
        }

        .buttons {
            margin-top: 30px;
            display: flex;
            gap: 14px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 14px 22px;
            border-radius: 999px;
            text-decoration: none;
            font-weight: 700;
            transition: .2s;
        }

        .btn-main {
            background: #d8c48f;
            color: #111;
        }

        .btn-support {
            border: 1px solid rgba(255,255,255,.35);
            color: #fff;
            background: rgba(255,255,255,.08);
        }

        .btn:hover {
            transform: translateY(-2px);
            opacity: .92;
        }

        .contacts {
            margin-top: 24px;
            color: #bdbdbd;
            font-size: 14px;
        }

        .contacts a {
            color: #d8c48f;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="bg"></div>

    <main class="wrap">
        <section class="card">
            <div class="code">404</div>
            <h1>Страница не найдена в архиве А.Н.И.</h1>
            <p>
                Возможно, страница была удалена, перемещена или ещё не получила своё место
                в цифровой памяти проекта.
            </p>

            <div class="buttons">
                <a class="btn btn-main" href="/">Вернуться на главную</a>
                <a class="btn btn-support" href="https://t.me/areg19areg" target="_blank">
                    Связаться с техподдержкой
                </a>
            </div>

            <div class="contacts">
                Telegram: <a href="https://t.me/areg19areg">@areg19areg</a><br>
                Email: <a href="mailto:areg.dzharayan@bk.ru">areg.dzharayan@bk.ru</a>
            </div>
        </section>
    </main>
</body>
</html>
